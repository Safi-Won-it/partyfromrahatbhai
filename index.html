<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rahat Bhai's Party</title>
  <style>
    /* Minimalist iOS Glass Design */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #eef2f3 0%, #e8ebf2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      color: #1c1c1e;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      padding-bottom: 30px;
    }

    /* Header */
    .app-header {
      text-align: center;
      margin: 16px 0 24px 0;
    }

    .app-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin: 0 0 4px 0;
      color: #000000;
    }

    .app-header p {
      font-size: 13px;
      color: #8e8e93;
      margin: 0;
      font-weight: 400;
    }

    /* Minimal Glass Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
      padding: 18px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8e8e93;
      margin-bottom: 12px;
    }

    /* Segmented Selector for 4 People */
    .person-selector {
      display: flex;
      background: rgba(118, 118, 128, 0.08);
      border-radius: 10px;
      padding: 2px;
      margin-bottom: 16px;
      gap: 2px;
    }

    .person-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #636366;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .person-btn.active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* Day Row Inputs */
    .day-row {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-title {
      font-weight: 600;
      font-size: 14px;
      color: #1c1c1e;
    }

    .work-toggle {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #636366;
    }

    .time-inputs {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 0, 0, 0.06);
    }

    .time-field {
      flex: 1;
    }

    .time-field label {
      display: block;
      font-size: 10px;
      color: #8e8e93;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .time-field input[type="time"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #1c1c1e;
      outline: none;
    }

    /* Minimal Buttons */
    .btn-primary {
      width: 100%;
      background: #007aff;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 8px;
    }

    .btn-primary:active {
      transform: scale(0.99);
      background: #0062cc;
    }

    .btn-secondary {
      background: transparent;
      color: #007aff;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    /* Suggestion Cards */
    .match-card {
      background: rgba(255, 255, 255, 0.7);
      border-left: 3px solid #34c759;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .match-title {
      font-weight: 600;
      color: #1c1c1e;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .match-desc {
      font-size: 12px;
      color: #636366;
    }

    /* Saved Overview */
    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      font-size: 13px;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-name {
      font-weight: 600;
    }

    .status-badge {
      font-size: 11px;
      color: #8e8e93;
    }

    .btn-clear {
      width: 100%;
      background: transparent;
      color: #ff3b30;
      border: none;
      font-size: 13px;
      font-weight: 500;
      padding: 8px;
      margin-top: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="app-header">
      <h1>Rahat Bhai's Party</h1>
      <p>Find the best dinner time together</p>
    </div>

    <!-- STEP 1: Person & Work Hours -->
    <div class="glass-card">
      <div class="section-title">Select Person</div>
      <div class="person-selector">
        <button class="person-btn active" onclick="selectPerson('Safi')">Safi</button>
        <button class="person-btn" onclick="selectPerson('Shakil')">Shakil</button>
        <button class="person-btn" onclick="selectPerson('Rahat')">Rahat</button>
        <button class="person-btn" onclick="selectPerson('Bishal')">Bishal</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div class="section-title" style="margin: 0;">Work Hours (Next 7 Days)</div>
        <button class="btn-secondary" onclick="applyDefaultShift()">Set 9am-5pm</button>
      </div>

      <div id="workDaysContainer"></div>

      <button class="btn-primary" onclick="saveWorkSchedule()">Save Schedule</button>
    </div>

    <!-- STEP 2: Dinner Suggestions -->
    <div class="glass-card">
      <div class="section-title">Best Dinner Suggestions</div>
      <div id="recommendationArea">
        <p style="font-size: 13px; color: #8e8e93; text-align: center; margin: 10px 0;">Enter schedules for Safi, Shakil, Rahat, and Bishal to see matching times.</p>
      </div>
    </div>

    <!-- STEP 3: Status Summary -->
    <div class="glass-card">
      <div class="section-title">Saved Status</div>
      <div id="statusList"></div>
      <button class="btn-clear" onclick="clearData()">Reset All Data</button>
    </div>
  </div>

  <script>
    let selectedPerson = 'Safi';
    let upcomingDays = [];

    // Local Storage Data for Safi, Shakil, Rahat, and Bishal
    let savedData = JSON.parse(localStorage.getItem('rahat_party_work_data')) || {
      'Safi': {},
      'Shakil': {},
      'Rahat': {},
      'Bishal': {}
    };

    function generateUpcomingDays() {
      const dates = [];
      const today = new Date();
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);

        const isoDate = d.toISOString().split('T')[0];
        const dayName = i === 0 ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short' });
        const dayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        dates.push({ isoDate, dayName, dayDate });
      }
      return dates;
    }

    function init() {
      upcomingDays = generateUpcomingDays();
      renderWorkInputs();
      renderResultsAndOverview();
    }

    function selectPerson(name) {
      selectedPerson = name;
      document.querySelectorAll('.person-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === name);
      });
      renderWorkInputs();
    }

    function renderWorkInputs() {
      const container = document.getElementById('workDaysContainer');
      container.innerHTML = '';
      const personSchedule = savedData[selectedPerson] || {};

      upcomingDays.forEach(day => {
        const dayData = personSchedule[day.isoDate] || { working: true, start: "09:00", end: "17:00" };

        const dayRow = document.createElement('div');
        dayRow.className = 'day-row';
        dayRow.innerHTML = `
          <div class="day-header">
            <span class="day-title">${day.dayName} (${day.dayDate})</span>
            <label class="work-toggle">
              <input type="checkbox" id="work_${day.isoDate}" ${dayData.working ? 'checked' : ''} onchange="toggleWorkFields('${day.isoDate}')">
              Working
            </label>
          </div>
          <div class="time-inputs" id="times_${day.isoDate}" style="display: ${dayData.working ? 'flex' : 'none'};">
            <div class="time-field">
              <label>Start</label>
              <input type="time" id="start_${day.isoDate}" value="${dayData.start}">
            </div>
            <div class="time-field">
              <label>End</label>
              <input type="time" id="end_${day.isoDate}" value="${dayData.end}">
            </div>
          </div>
        `;
        container.appendChild(dayRow);
      });
    }

    function toggleWorkFields(isoDate) {
      const isChecked = document.getElementById(`work_${isoDate}`).checked;
      document.getElementById(`times_${isoDate}`).style.display = isChecked ? 'flex' : 'none';
    }

    function applyDefaultShift() {
      upcomingDays.forEach(day => {
        const workCheck = document.getElementById(`work_${day.isoDate}`);
        const startInput = document.getElementById(`start_${day.isoDate}`);
        const endInput = document.getElementById(`end_${day.isoDate}`);

        if (workCheck && startInput && endInput) {
          workCheck.checked = true;
          startInput.value = "09:00";
          endInput.value = "17:00";
          toggleWorkFields(day.isoDate);
        }
      });
    }

    function saveWorkSchedule() {
      if (!savedData[selectedPerson]) savedData[selectedPerson] = {};

      upcomingDays.forEach(day => {
        const isWorking = document.getElementById(`work_${day.isoDate}`).checked;
        const start = document.getElementById(`start_${day.isoDate}`).value;
        const end = document.getElementById(`end_${day.isoDate}`).value;

        savedData[selectedPerson][day.isoDate] = { working: isWorking, start, end };
      });

      localStorage.setItem('rahat_party_work_data', JSON.stringify(savedData));
      alert(`Schedule saved for ${selectedPerson}!`);
      renderResultsAndOverview();
    }

    function timeToMins(t) {
      if (!t) return 0;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minsTo12H(mins) {
      let h = Math.floor(mins / 60);
      const m = mins % 60;
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      h = h ? h : 12; 
      const mStr = m < 10 ? '0' + m : m;
      return `${h}:${mStr} ${ampm}`;
    }

    function renderResultsAndOverview() {
      const recArea = document.getElementById('recommendationArea');
      const statusList = document.getElementById('statusList');
      recArea.innerHTML = '';
      statusList.innerHTML = '';

      const people = ['Safi', 'Shakil', 'Rahat', 'Bishal'];

      // Render Saved Overview
      people.forEach(p => {
        const hasData = savedData[p] && Object.keys(savedData[p]).length > 0;
        let details = 'Not entered';

        if (hasData) {
          const shiftCounts = Object.values(savedData[p]).filter(x => x.working).length;
          details = `Working ${shiftCounts} days`;
        }

        statusList.innerHTML += `
          <div class="status-item">
            <span class="status-name">${p}</span>
            <span class="status-badge">${details}</span>
          </div>
        `;
      });

      // Calculate common free time (Target: 5:00 PM to 11:00 PM)
      const DINNER_START = 17 * 60; // 5:00 PM
      let matchesFound = 0;

      upcomingDays.forEach(day => {
        let earliestFree = DINNER_START;
        let everyoneHasData = true;

        people.forEach(p => {
          const pDay = savedData[p] ? savedData[p][day.isoDate] : null;

          if (!pDay) {
            everyoneHasData = false;
            return;
          }

          if (pDay.working) {
            const endMins = timeToMins(pDay.end);
            if (endMins > earliestFree) {
              earliestFree = endMins;
            }
          }
        });

        if (everyoneHasData) {
          // If everyone is free before 10:30 PM
          if (earliestFree < (22 * 60 + 30)) {
            matchesFound++;
            const freeTimeStr = minsTo12H(earliestFree);
            recArea.innerHTML += `
              <div class="match-card">
                <div class="match-title">${day.dayName} (${day.dayDate})</div>
                <div class="match-desc">
                  <strong>Dinner Time:</strong> ${freeTimeStr} onwards
                </div>
              </div>
            `;
          }
        }
      });

      if (!matchesFound) {
        recArea.innerHTML = `<p style="font-size: 13px; color: #8e8e93; text-align: center; margin: 10px 0;">No matching times found yet. Ensure all 4 members have saved their work shifts.</p>`;
      }
    }

    function clearData() {
      if (confirm('Clear all saved work schedules?')) {
        localStorage.removeItem('rahat_party_work_data');
        savedData = { 'Safi': {}, 'Shakil': {}, 'Rahat': {}, 'Bishal': {} };
        init();
      }
    }

    init();
  </script>
</body>
</html>
